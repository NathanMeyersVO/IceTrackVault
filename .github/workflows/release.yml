name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-windows:
    environment: release
    permissions:
      contents: write
      id-token: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Install artifact-signing-cli
        run: cargo install artifact-signing-cli --locked

      - name: Add cargo bin to PATH
        run: echo "$env:USERPROFILE\.cargo\bin" >> $env:GITHUB_PATH

      - name: Write Windows signing config
        shell: pwsh
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          $signCommand = "artifact-signing-cli -e $env:AZURE_SIGNING_ENDPOINT -a $env:AZURE_SIGNING_ACCOUNT -c $env:AZURE_SIGNING_PROFILE -d IceTrackVault %1"
          $config = @{
            bundle = @{
              windows = @{
                signCommand = $signCommand
              }
            }
          } | ConvertTo-Json -Depth 4 -Compress
          Set-Content -Path src-tauri/tauri.windows.conf.json -Value $config -Encoding utf8NoBOM

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: IceTrackVault ${{ github.ref_name }}
          releaseBody: See the assets below to download and install this version on Windows.
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc --config tauri.windows.conf.json
